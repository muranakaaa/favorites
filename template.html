<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#fbfaf6">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{URL}}{{OGP_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@{{HANDLE}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚃</text></svg>">
<style>
:root {
  --bg: #fbfaf6;
  --text: #1d1c1a;
  --muted: #6d6a64;
  --rule: #d9d5cc;
  --link: #1f4e79;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  font-size: 16px;
  line-height: 1.9;
  overflow-wrap: anywhere;
}
a { color: var(--link); text-decoration: underline; text-underline-offset: .15em; }
.wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px calc(60px + env(safe-area-inset-bottom)); }

h1 { font-size: 1.7rem; font-weight: 600; margin: 0 0 4px; letter-spacing: .06em; }
.lead { margin: 0 0 6px; }
.toc { font-size: .9rem; color: var(--muted); margin: 0 0 36px; }
.toc a { color: var(--muted); }

section { margin: 0 0 30px; }
h2 { font-size: 1rem; font-weight: 600; margin: 0 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); letter-spacing: .04em; }
p { margin: 0 0 8px; }

.posts { list-style: none; padding: 0; margin: 0; }
.posts li { padding: 14px 0; border-bottom: 1px dotted var(--rule); }
.posts time { display: block; font-size: .82rem; font-family: ui-monospace, Menlo, monospace; color: var(--muted); margin-bottom: 2px; }
.posts time a { color: var(--muted); text-decoration: none; }
.posts time a:hover { text-decoration: underline; }
.posts p { margin: 0; }
.thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.shot { padding: 0; margin: 0; border: 0; background: none; cursor: zoom-in; line-height: 0; }
.shot img { width: 72px; height: 72px; object-fit: cover; display: block; border: 1px solid var(--rule); }

iframe { display: block; width: 100%; height: 152px; border: 0; margin-top: 6px; }

footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: .85rem; color: var(--muted); }
footer p { margin: 0 0 4px; }

.lightbox { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(20, 20, 18, .95); touch-action: pan-y; }
.lightbox[open] { display: flex; }
.lightbox img { max-width: 100vw; max-height: 100dvh; object-fit: contain; }
.lightbox button { position: absolute; border: 0; background: rgba(255, 255, 255, .15); color: #fff; border-radius: 50%; cursor: pointer; font-size: 1.2rem; line-height: 1; }
.lightbox .close { top: calc(12px + env(safe-area-inset-top)); right: 12px; width: 40px; height: 40px; }
.lightbox .prev, .lightbox .next { top: 50%; transform: translateY(-50%); width: 44px; height: 44px; }
.lightbox .prev { left: 10px; }
.lightbox .next { right: 10px; }
.lightbox .count { position: absolute; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); color: rgba(255, 255, 255, .8); font-size: .8rem; font-family: ui-monospace, Menlo, monospace; }
.lightbox[data-single="1"] .prev, .lightbox[data-single="1"] .next, .lightbox[data-single="1"] .count { display: none; }
</style>
</head>
<body>
<div class="wrap" id="top">
<h1>{{TITLE}}</h1>
<p class="lead">{{LEAD}}</p>
<p class="toc">{{TOC}}</p>

{{BODY}}

<footer>
<p>X: <a href="https://x.com/{{HANDLE}}" target="_blank" rel="noopener">@{{HANDLE}}</a></p>
<p>since {{SINCE}} ／ <a href="#top">上へ</a></p>
</footer>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="写真">
<img id="lb-img" alt="">
<button class="close" type="button" aria-label="閉じる">✕</button>
<button class="prev" type="button" aria-label="前の写真">‹</button>
<button class="next" type="button" aria-label="次の写真">›</button>
<span class="count" id="lb-count"></span>
</div>

<script>
const MEDIA = {{LIGHTBOX_DATA}};
const box = document.getElementById('lightbox');
const boxImg = document.getElementById('lb-img');
const boxCount = document.getElementById('lb-count');
let shots = [];
let cursor = 0;

function show(i) {
  cursor = (i + shots.length) % shots.length;
  const shot = shots[cursor];
  boxImg.src = shot.src;
  boxImg.width = shot.w;
  boxImg.height = shot.h;
  boxCount.textContent = `${cursor + 1} / ${shots.length}`;
}

function openBox(postId, index) {
  shots = MEDIA[postId] || [];
  if (!shots.length) return;
  box.dataset.single = shots.length === 1 ? '1' : '0';
  box.setAttribute('open', '');
  document.body.style.overflow = 'hidden';
  show(index);
}

function closeBox() {
  box.removeAttribute('open');
  document.body.style.overflow = '';
  boxImg.removeAttribute('src');
}

document.addEventListener('click', (e) => {
  const shot = e.target.closest('.shot');
  if (shot) openBox(shot.dataset.post, Number(shot.dataset.index));
});

box.addEventListener('click', (e) => {
  const button = e.target.closest('button');
  if (!button) { closeBox(); return; }
  if (button.classList.contains('close')) closeBox();
  if (button.classList.contains('prev')) show(cursor - 1);
  if (button.classList.contains('next')) show(cursor + 1);
});

document.addEventListener('keydown', (e) => {
  if (!box.hasAttribute('open')) return;
  if (e.key === 'Escape') closeBox();
  if (e.key === 'ArrowLeft') show(cursor - 1);
  if (e.key === 'ArrowRight') show(cursor + 1);
});

let touchStartX = 0;
box.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
box.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) show(cursor + (dx < 0 ? 1 : -1));
}, { passive: true });
</script>
</body>
</html>
