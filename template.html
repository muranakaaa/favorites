<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}{{PAGE}}">
<meta property="og:image" content="{{URL}}{{OGP_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@{{HANDLE}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚃</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap">
<style>
* { box-sizing: border-box; }
html { font-size: 15px; background: #fff; }
body {
  margin: 0;
  color: #333;
  background: #fff;
  font-family: Inter, "Noto Sans JP", sans-serif;
  font-size: 15px;
  line-height: 24px;
  overflow-wrap: anywhere;
}
a { color: #666; text-decoration: underline; text-decoration-color: rgba(0, 0, 0, .2); text-underline-offset: 5px; }
a:hover { text-decoration-color: rgba(0, 0, 0, .5); }

.page { margin: 30px; }
main { max-width: 800px; }
h1 { font-size: 28px; font-weight: 700; line-height: 1.6; margin: 0 0 10px; }
h3 { font-size: 16px; font-weight: 400; line-height: 1.6; margin: 0 0 4px; }
h3::before { content: "# "; color: #ccc; margin-right: 4px; }
p { margin: 0 0 12px; }
.updated { color: #999; font-size: 14px; margin: 0 0 4px; }

/* 左端のナビ。触ると開く */
header {
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  width: 5px;
  background: rgba(0, 0, 0, .2);
  z-index: 10;
  display: none;
}
header:hover, header:focus-within { width: 332px; background: #fff; box-shadow: 4px 0 24px rgba(0, 0, 0, .08); }
header > div { display: none; width: 300px; margin: 32px 16px; }
header:hover > div, header:focus-within > div { display: block; }
header ul { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0 0 0 18px; }
header li { display: flex; position: relative; padding: 2px 0; }
header a { color: #666; font-weight: 600; }
header li.current::before { content: ""; position: absolute; left: -36px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: #df51a8; }
@media (min-width: 720px) {
  header { display: block; }
  .page { margin: 40px 56px; }
}

.posts { list-style: none; padding: 0; margin: 0; }
.posts li { margin: 0 0 22px; }
.posts h3 { color: #666; }
.posts p { margin: 0 0 8px; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
.shot { padding: 0; margin: 0; border: 0; background: none; cursor: zoom-in; line-height: 0; }
.shot img { width: 72px; height: 72px; object-fit: cover; display: block; border: 1px solid rgba(0, 0, 0, .1); }

iframe { display: block; width: 100%; max-width: 480px; height: 152px; border: 0; margin: 0 0 12px; }

footer { margin: 20px 0 0; padding: 10px 0 0; border-top: 1px solid rgba(0, 0, 0, .2); font-size: 14px; line-height: 1.6; }

.lightbox { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(20, 20, 20, .95); touch-action: pan-y; }
.lightbox[open] { display: flex; }
.lightbox img { max-width: 100vw; max-height: 100dvh; object-fit: contain; }
.lightbox button { position: absolute; border: 0; background: rgba(255, 255, 255, .15); color: #fff; border-radius: 50%; cursor: pointer; font-size: 1.2rem; line-height: 1; }
.lightbox .close { top: calc(12px + env(safe-area-inset-top)); right: 12px; width: 40px; height: 40px; }
.lightbox .prev, .lightbox .next { top: 50%; transform: translateY(-50%); width: 44px; height: 44px; }
.lightbox .prev { left: 10px; }
.lightbox .next { right: 10px; }
.lightbox .count { position: absolute; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); color: rgba(255, 255, 255, .8); font-size: 13px; }
.lightbox[data-single="1"] .prev, .lightbox[data-single="1"] .next, .lightbox[data-single="1"] .count { display: none; }
</style>
</head>
<body>
<header><div><ul>{{NAV}}</ul></div></header>
<div class="page" id="top">
{{UPDATED}}
<h1>{{H1}}</h1>
<main>
{{BODY}}
</main>
<footer>現在のページ：<a href="{{PAGE_HREF}}">{{H1}}（/{{PAGE}}）</a>｜<a href="./">トップページ</a> – <a href="#top">ページ上部</a></footer>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="写真">
<img id="lb-img" alt="">
<button class="close" type="button" aria-label="閉じる">✕</button>
<button class="prev" type="button" aria-label="前の写真">‹</button>
<button class="next" type="button" aria-label="次の写真">›</button>
<span class="count" id="lb-count"></span>
</div>

<script>
const MEDIA = {{LIGHTBOX_DATA}};
const box = document.getElementById('lightbox');
const boxImg = document.getElementById('lb-img');
const boxCount = document.getElementById('lb-count');
let shots = [];
let cursor = 0;

function show(i) {
  cursor = (i + shots.length) % shots.length;
  const shot = shots[cursor];
  boxImg.src = shot.src;
  boxImg.width = shot.w;
  boxImg.height = shot.h;
  boxCount.textContent = `${cursor + 1} / ${shots.length}`;
}

function openBox(postId, index) {
  shots = MEDIA[postId] || [];
  if (!shots.length) return;
  box.dataset.single = shots.length === 1 ? '1' : '0';
  box.setAttribute('open', '');
  document.body.style.overflow = 'hidden';
  show(index);
}

function closeBox() {
  box.removeAttribute('open');
  document.body.style.overflow = '';
  boxImg.removeAttribute('src');
}

document.addEventListener('click', (e) => {
  const shot = e.target.closest('.shot');
  if (shot) openBox(shot.dataset.post, Number(shot.dataset.index));
});

box.addEventListener('click', (e) => {
  const button = e.target.closest('button');
  if (!button) { closeBox(); return; }
  if (button.classList.contains('close')) closeBox();
  if (button.classList.contains('prev')) show(cursor - 1);
  if (button.classList.contains('next')) show(cursor + 1);
});

document.addEventListener('keydown', (e) => {
  if (!box.hasAttribute('open')) return;
  if (e.key === 'Escape') closeBox();
  if (e.key === 'ArrowLeft') show(cursor - 1);
  if (e.key === 'ArrowRight') show(cursor + 1);
});

let touchStartX = 0;
box.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
box.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) show(cursor + (dx < 0 ? 1 : -1));
}, { passive: true });
</script>
</body>
</html>
