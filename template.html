<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{URL}}{{OGP_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@{{HANDLE}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚃</text></svg>">
<style>
:root {
  --bg: #faf8f5;
  --card: #ffffff;
  --line: #e7e1d8;
  --text: #23201c;
  --muted: #7a7268;
  --accent: #9a6b4a;
  --shadow: 0 1px 2px rgba(35, 32, 28, .05), 0 6px 16px rgba(35, 32, 28, .05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14130f;
    --card: #1e1c18;
    --line: #322e28;
    --text: #e9e4db;
    --muted: #9b9287;
    --accent: #d7a173;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 16px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}
a { color: var(--accent); }

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 16px calc(64px + env(safe-area-inset-bottom));
}

header.intro {
  padding: 56px 0 28px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
}
header.intro h1 {
  margin: 0 0 12px;
  font-size: 1.5rem;
  line-height: 1.5;
  letter-spacing: .02em;
}
header.intro p { margin: 0 0 6px; color: var(--muted); font-size: .95rem; }
header.intro .handle { font-weight: 600; color: var(--accent); text-decoration: none; }

section > h2 {
  margin: 34px 0 14px;
  font-size: .82rem;
  font-weight: 600;
  letter-spacing: .12em;
  color: var(--muted);
}

.music iframe {
  display: block;
  width: 100%;
  height: 420px;
  border: 0;
  border-radius: 14px;
}
.music p { margin: 10px 2px 0; font-size: .8rem; color: var(--muted); }
.music p a { text-decoration: none; }

.wishlist a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  text-decoration: none;
  color: var(--text);
}
.wishlist strong { font-weight: 600; font-size: .95rem; }
.wishlist span { margin-left: auto; color: var(--accent); font-size: .85rem; }

.posts { display: flex; flex-direction: column; gap: 16px; }

.post {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  box-shadow: var(--shadow);
}
.post .text { margin: 0; font-size: 1rem; }
.post .text:empty { display: none; }

.media { display: grid; gap: 4px; margin-top: 14px; border-radius: 10px; overflow: hidden; }
.media.m2, .media.m4 { grid-template-columns: 1fr 1fr; }
.media.m3 { grid-template-columns: 1fr 1fr; }
.media.m3 .shot:first-child { grid-column: 1 / -1; }
.shot {
  display: block;
  padding: 0;
  margin: 0;
  border: 0;
  background: none;
  cursor: zoom-in;
  line-height: 0;
}
.shot img { width: 100%; height: auto; display: block; background: var(--line); }
.media.m2 .shot img, .media.m4 .shot img { aspect-ratio: 1 / 1; object-fit: cover; }
.media.m3 .shot:not(:first-child) img { aspect-ratio: 1 / 1; object-fit: cover; }

.meta {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 12px;
  font-size: .8rem;
  color: var(--muted);
}
.meta a { margin-left: auto; text-decoration: none; }
.meta a:hover { text-decoration: underline; }

.posts.laid-out { flex-direction: row; align-items: flex-start; }
.posts .col { flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

@media (min-width: 720px) {
  header.intro h1 { font-size: 1.8rem; }
}

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(10, 9, 7, .94);
  touch-action: pan-y;
}
.lightbox[open] { display: flex; }
.lightbox img {
  max-width: 100vw;
  max-height: 100dvh;
  object-fit: contain;
}
.lightbox button {
  position: absolute;
  border: 0;
  background: rgba(255, 255, 255, .12);
  color: #fff;
  border-radius: 999px;
  cursor: pointer;
  font-size: 1.2rem;
  line-height: 1;
}
.lightbox .close {
  top: calc(12px + env(safe-area-inset-top));
  right: 12px;
  width: 40px;
  height: 40px;
}
.lightbox .prev, .lightbox .next {
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
}
.lightbox .prev { left: 10px; }
.lightbox .next { right: 10px; }
.lightbox .count {
  position: absolute;
  bottom: calc(16px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255, 255, 255, .8);
  font-size: .8rem;
}
.lightbox[data-single="1"] .prev,
.lightbox[data-single="1"] .next,
.lightbox[data-single="1"] .count { display: none; }

footer.foot {
  margin-top: 48px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  font-size: .82rem;
  color: var(--muted);
}
</style>
</head>
<body>
<div class="wrap">
<header class="intro">
<h1>村中のお気に入りの投稿</h1>
<p>{{DESCRIPTION}}</p>
<p>Xに書いたもののうち自分で読み返したい{{COUNT}}件と、聴いてきた音楽、ほしいものを置いています。</p>
<p><a class="handle" href="https://x.com/{{HANDLE}}" target="_blank" rel="noopener">@{{HANDLE}}</a></p>
</header>

<section class="music">
<h2>音楽</h2>
<iframe src="https://open.spotify.com/embed/playlist/{{PLAYLIST_ID}}?theme=0" title="Spotify: {{PLAYLIST_NAME}}" loading="lazy" allow="clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
<p><a href="https://open.spotify.com/playlist/{{PLAYLIST_ID}}" target="_blank" rel="noopener">{{PLAYLIST_NAME}}</a> をSpotifyで開く</p>
</section>

<section class="wishlist">
<h2>ほしいもの</h2>
<a href="{{WISHLIST_URL}}" target="_blank" rel="noopener"><strong>Amazonのほしい物リスト</strong><span>開く →</span></a>
</section>

<section class="feed">
<h2>投稿</h2>
<div class="posts">
{{FEED}}
</div>
</section>

<footer class="foot">写真と本文はXの投稿から。最新の投稿は <a href="https://x.com/{{HANDLE}}" target="_blank" rel="noopener">@{{HANDLE}}</a> にあります。</footer>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="写真">
<img id="lb-img" alt="">
<button class="close" type="button" aria-label="閉じる">✕</button>
<button class="prev" type="button" aria-label="前の写真">‹</button>
<button class="next" type="button" aria-label="次の写真">›</button>
<span class="count" id="lb-count"></span>
</div>

<script>
const MEDIA = {{LIGHTBOX_DATA}};
const box = document.getElementById('lightbox');
const boxImg = document.getElementById('lb-img');
const boxCount = document.getElementById('lb-count');
let shots = [];
let cursor = 0;

function show(i) {
  cursor = (i + shots.length) % shots.length;
  const shot = shots[cursor];
  boxImg.src = shot.src;
  boxImg.width = shot.w;
  boxImg.height = shot.h;
  boxCount.textContent = `${cursor + 1} / ${shots.length}`;
}

function openBox(postId, index) {
  shots = MEDIA[postId] || [];
  if (!shots.length) return;
  box.dataset.single = shots.length === 1 ? '1' : '0';
  box.setAttribute('open', '');
  document.body.style.overflow = 'hidden';
  show(index);
}

function closeBox() {
  box.removeAttribute('open');
  document.body.style.overflow = '';
  boxImg.removeAttribute('src');
}

document.addEventListener('click', (e) => {
  const shot = e.target.closest('.shot');
  if (shot) openBox(shot.dataset.post, Number(shot.dataset.index));
});

box.addEventListener('click', (e) => {
  const button = e.target.closest('button');
  if (!button) { closeBox(); return; }
  if (button.classList.contains('close')) closeBox();
  if (button.classList.contains('prev')) show(cursor - 1);
  if (button.classList.contains('next')) show(cursor + 1);
});

document.addEventListener('keydown', (e) => {
  if (!box.hasAttribute('open')) return;
  if (e.key === 'Escape') closeBox();
  if (e.key === 'ArrowLeft') show(cursor - 1);
  if (e.key === 'ArrowRight') show(cursor + 1);
});

const feed = document.querySelector('.posts');
const cards = Array.from(feed.children);

function columnCount() {
  if (window.innerWidth >= 1040) return 3;
  if (window.innerWidth >= 720) return 2;
  return 1;
}

function layout() {
  const count = columnCount();
  if (feed.dataset.columns === String(count)) return;
  feed.dataset.columns = count;
  feed.classList.toggle('laid-out', count > 1);
  feed.textContent = '';
  if (count === 1) {
    cards.forEach((card) => feed.append(card));
    return;
  }
  const columns = Array.from({ length: count }, () => {
    const column = document.createElement('div');
    column.className = 'col';
    feed.append(column);
    return column;
  });
  cards.forEach((card) => {
    const shortest = columns.reduce((a, b) => (a.offsetHeight <= b.offsetHeight ? a : b));
    shortest.append(card);
  });
}

layout();
window.addEventListener('resize', layout);

let touchStartX = 0;
box.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
box.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) show(cursor + (dx < 0 ? 1 : -1));
}, { passive: true });
</script>
</body>
</html>
